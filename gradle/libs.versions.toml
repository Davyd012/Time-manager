[versions]
agp = "8.5.2"
kotlin = "2.0.20"
core-ktx = "1.13.1"
junit = "4.13.2"
androidx-test-ext-junit = "1.2.1"
espresso-core = "3.6.1"
kotlinx-serialization-json = "1.7.3"
lifecycle-runtime-ktx = "2.8.6"
activity-compose = "1.9.3"
