workflows:
  ios-validation:
    name: Timnor iOS Validation
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      java: 21
      xcode: 26.4
      vars:
        XCODE_PROJECT: iosApp/Timnor.xcodeproj
        XCODE_SCHEME: Timnor
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.konan
    scripts:
      - name: Capture toolchain
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodebuild -version | tee "$CM_BUILD_DIR/ios-validation-toolchain.log"
          java -version 2>&1 | tee -a "$CM_BUILD_DIR/ios-validation-toolchain.log"
          bash ./gradlew --version 2>&1 | tee -a "$CM_BUILD_DIR/ios-validation-toolchain.log"
      - name: Compile shared targets and run tests
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          bash ./gradlew \
            :shared:compileAndroidMain \
            :shared:testAndroidHostTest \
            :shared:compileKotlinIosArm64 \
            :shared:compileKotlinIosSimulatorArm64 \
            --console=plain
          python3 scripts/run-with-timeout.py 3600 -- \
            bash ./gradlew :shared:iosSimulatorArm64Test --console=plain
      - name: Build unsigned simulator app
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$CM_BUILD_DIR/ios-validation-xcodebuild.log"
    artifacts:
      - shared/build/reports/tests/**
      - shared/build/test-results/**
      - /tmp/xcodebuild_logs/*.log
      - ios-validation-*.log

  ios-testflight-internal-preparation:
    name: Timnor Internal TestFlight Upload (gated)
    instance_type: mac_mini_m2
    max_build_duration: 120
    integrations:
      app_store_connect: Codemagic TaskNord
    environment:
      java: 21
      xcode: 26.4
      ios_signing:
        distribution_type: app_store
        bundle_identifier: no.timnor.ios
      vars:
        XCODE_PROJECT: iosApp/Timnor.xcodeproj
        XCODE_SCHEME: Timnor
    scripts:
      - name: Require release gate confirmation
        script: |
          set -euo pipefail
          if [ "${TIMNOR_TESTFLIGHT_ARCHIVE_ENABLED:-false}" != "true" ]; then
            echo "Blocked: confirm Timnor identity, signing, versions, and release decisions before enabling this workflow."
            exit 1
          fi
          if [ -z "${APP_STORE_APPLE_ID:-}" ]; then
            echo "Blocked: configure APP_STORE_APPLE_ID as a protected Codemagic environment variable."
            exit 1
          fi
      - name: Prepare App Store signing
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/iosApp"
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/$XCODE_PROJECT"
      - name: Build signed IPA for internal TestFlight
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          latest_build_number="$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")"
          latest_build_number="${latest_build_number:-0}"
          if ! [[ "$latest_build_number" =~ ^[0-9]+$ ]]; then
            echo "Expected a numeric TestFlight build number, got: $latest_build_number"
            exit 1
          fi
          next_build_number=$((10#$latest_build_number + 1))
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME" \
            --archive-flags="-destination 'generic/platform=iOS' MARKETING_VERSION=1.0 CURRENT_PROJECT_VERSION=$next_build_number"
      - name: Verify IPA identity
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          ipa_path="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          test -n "$ipa_path"
          inspect_dir="$(mktemp -d)"
          unzip -q "$ipa_path" -d "$inspect_dir"
          app_info="$(find "$inspect_dir/Payload" -type f -name Info.plist -print -quit)"
          test -n "$app_info"
          bundle_identifier="$(/usr/libexec/PlistBuddy -c 'Print:CFBundleIdentifier' "$app_info")"
          test "$bundle_identifier" = "no.timnor.ios"
          test "$(/usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' "$app_info")" = "1.0"
          /usr/libexec/PlistBuddy -c 'Print:CFBundleVersion' "$app_info"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
